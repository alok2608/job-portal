services:
  - type: web
    name: job-portal
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGO_DB
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DEV_MODE
        value: production
      - key: API_URL
        sync: false
